<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #E5E7E4;
    --panel: #FBFAF7;
    --ink: #1C2430;
    --ink-soft: #5B6472;
    --line: #CBCFC9;
    --charcoal: #1B2531;
    --blue: #4472C4;
    --blue-soft: #E7EDF9;
    --green: #4E9153;
    --green-soft: #E7F2E4;
    --orange: #D9691F;
    --orange-soft: #FBEBDD;
    --purple: #7030A0;
    --purple-soft: #F0E4F7;
    --red: #B23A3A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  .app{max-width:1180px;margin:0 auto;padding:0 0 60px;}

  /* header */
  .topbar{background:var(--charcoal);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:4px solid var(--orange);}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:1px;text-transform:uppercase;margin:0;font-weight:700;}
  .brand .tag{font-size:12px;color:#9CA6B4;letter-spacing:1.5px;text-transform:uppercase;}
  .weekof{display:flex;align-items:center;gap:8px;font-size:13px;color:#C7CDD6;}
  .weekof input{background:#28323F;border:1px solid #3C4756;color:#fff;border-radius:6px;padding:5px 8px;font-family:'Inter';font-size:13px;}
  .mode-btn{display:flex;align-items:center;gap:8px;}
  button.pill{border:1px solid #3C4756;background:#28323F;color:#E5E9EE;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.3px;font-family:'Inter';}
  button.pill:hover{background:#333F4E;}
  button.pill.active{background:var(--orange);border-color:var(--orange);color:#fff;}

  /* tabs */
  .tabs{display:flex;gap:4px;padding:16px 22px 0;flex-wrap:wrap;}
  .tab{font-family:'Oswald',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.5px;padding:10px 16px;cursor:pointer;color:var(--ink-soft);border-bottom:3px solid transparent;font-weight:600;}
  .tab.active{color:var(--ink);border-bottom-color:var(--orange);}

  .content{padding:20px 22px;}

  .board-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .card-head{padding:10px 14px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.5px;text-transform:uppercase;font-size:14px;color:#fff;display:flex;align-items:center;justify-content:space-between;}
  .card-body{padding:12px 14px;}

  .roster-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #EEEDE8;font-size:14px;}
  .roster-item:last-child{border-bottom:none;}
  .roster-item .lead{font-weight:600;}
  .rm-btn{border:none;background:none;color:#B7BDC6;cursor:pointer;font-size:15px;padding:2px 6px;}
  .rm-btn:hover{color:var(--red);}
  .add-row{display:flex;gap:6px;margin-top:10px;}
  .add-row input{flex:1;padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:'Inter';}
  .add-row button{border:none;background:var(--charcoal);color:#fff;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;}

  .job-slot{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;background:#fff;}
  .job-slot-head{padding:8px 10px;border-bottom:1px solid var(--line);}
  .job-slot-head input{width:100%;border:none;background:transparent;font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:var(--ink);padding:2px 0;}
  .job-slot-head .placeholder{color:#A9AFB8;font-style:italic;font-weight:400;font-family:'Inter';font-size:13px;}
  .job-slot-body{padding:8px 10px;display:flex;flex-direction:column;gap:6px;}
  .crew-line{display:flex;align-items:center;gap:6px;}
  .crew-line input{flex:1;border:1px solid #E3E1DA;background:#FAFAF8;border-radius:6px;padding:6px 8px;font-size:13px;font-family:'Inter';}
  .crew-line input:disabled{border:none;background:transparent;padding:6px 0;color:var(--ink);}
  .crew-line input:disabled::placeholder{color:#B8BEC6;}
  .job-address{font-size:12px;color:var(--ink-soft);padding-top:4px;border-top:1px dashed var(--line);margin-top:2px;display:flex;gap:5px;align-items:flex-start;}
  .job-address .pin{flex-shrink:0;}

  .foreman-day{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #EEEDE8;font-size:14px;}
  .foreman-day:last-child{border-bottom:none;}
  .foreman-day .dow{width:52px;font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;letter-spacing:.5px;color:var(--ink-soft);}
  .foreman-day input{flex:1;border:1px solid #E3E1DA;background:#FAFAF8;border-radius:6px;padding:6px 8px;font-size:13px;font-family:'Inter';}
  .foreman-day input:disabled{border:none;background:transparent;padding:6px 0;color:var(--ink);}

  .pto-row{display:grid;grid-template-columns:1fr 130px 28px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #EEEDE8;font-size:13px;}
  .pto-row input{border:1px solid #E3E1DA;background:#FAFAF8;border-radius:6px;padding:6px 8px;font-size:13px;font-family:'Inter';}
  .pto-row input:disabled{border:none;background:transparent;padding:6px 0;}
  textarea.notes{width:100%;min-height:180px;border:1px solid #E3E1DA;background:#FAFAF8;border-radius:8px;padding:10px;font-family:'Inter';font-size:13px;resize:vertical;}
  textarea.notes:disabled{background:transparent;border:none;color:var(--ink);}

  .empty-hint{color:#A9AFB8;font-style:italic;font-size:13px;padding:6px 0;}
  .top-add{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .top-add button{border:1px dashed var(--ink-soft);background:transparent;color:var(--ink-soft);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Inter';}

  .modal-bg{position:fixed;inset:0;background:rgba(15,20,26,.55);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:10px;padding:22px;width:280px;text-align:center;}
  .modal h3{font-family:'Oswald',sans-serif;margin:0 0 12px;font-size:16px;text-transform:uppercase;}
  .modal input{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font-size:15px;text-align:center;letter-spacing:2px;margin-bottom:10px;}
  .modal button.go{width:100%;padding:9px;border:none;background:var(--orange);color:#fff;border-radius:6px;font-weight:600;cursor:pointer;font-family:'Inter';}
  .modal .err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:4px;}
  .modal .cancel{margin-top:8px;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;text-decoration:underline;}
  .savebar{position:fixed;bottom:16px;right:22px;background:var(--charcoal);color:#fff;font-size:12px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;}
  .savebar.show{opacity:1;}
  @media (max-width:640px){
    .board-row{grid-template-columns:1fr;}
  }
</style>

</head>

async function loadData(){
  try{
    const res = await fetch('/api/schedule');
    data = await res.json();
  } catch(e){
    data = defaultData();
  }
  if(!data.masterJobs || !Array.isArray(data.masterJobs)){
    data.masterJobs = DEFAULT_JOBS.slice();
  }
  if(!data.jobAddresses || typeof data.jobAddresses !== 'object'){
    data.jobAddresses = Object.assign({}, DEFAULT_JOB_ADDRESSES);
  }
  render();
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await fetch('/api/schedule', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      flashSaved();
    }catch(e){ console.error('save failed', e); }
  }, 400);
}

function flashSaved(){
  const bar = document.getElementById('savebar');
  bar.classList.add('show');
  setTimeout(()=>bar.classList.remove('show'), 900);
}

function anyInputFocused(){
  const a = document.activeElement;
  return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
}

async function pollRefresh(){
  if(anyInputFocused()) return;
  try{
    const res = await fetch('/api/schedule');
    const incoming = await res.json();
    if(JSON.stringify(incoming) !== JSON.stringify(data)){
      data = incoming;
      render();
    }
  }catch(e){}
}

function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${m}/${d}/${y}`;
}

function formatWeekRange(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const anchor = new Date(y, m-1, d);
  const dow = anchor.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (dow === 0) ? -6 : (1 - dow);
  const monday = new Date(anchor);
  monday.setDate(anchor.getDate() + diffToMonday);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const fmt = (dt)=> `${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}/${dt.getFullYear()}`;
  return `${fmt(monday)} – ${fmt(sunday)}`;
}

function attachEvents(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ activeTab = t.dataset.tab; render(); };
  });

  const unlockBtn = document.getElementById('unlockBtn');
  if(unlockBtn) unlockBtn.onclick = ()=>{ showPinModal = true; pinError=''; render(); setTimeout(()=>document.getElementById('pinInput')?.focus(),50); };

  const lockBtn = document.getElementById('lockBtn');
  if(lockBtn) lockBtn.onclick = ()=>{ isManager = false; render(); };

  const modalBg = document.getElementById('modalBg');
  if(modalBg){
    document.getElementById('pinCancel').onclick = ()=>{ showPinModal=false; render(); };
    document.getElementById('pinGo').onclick = tryPin;
    document.getElementById('pinInput').onkeydown = (e)=>{ if(e.key==='Enter') tryPin(); };
  }

  const weekOfInput = document.getElementById('weekOfInput');
  if(weekOfInput) weekOfInput.onchange = (e)=>{ data.weekOf = e.target.value; scheduleSave(); };

  document.querySelectorAll('[data-action="addCrewMember"]').forEach(btn=>{
    btn.onclick = ()=>{
      const crew = btn.dataset.crew;
      const input = document.querySelector(`[data-add-crew="${cssEsc(crew)}"]`);
      const val = input.value.trim();
      if(!val) return;
      data.crews[crew].push(val);
      if(!data.masterCrew.includes(val)) data.masterCrew.push(val);
      scheduleSave(); render();
    };
  });
  document.querySelectorAll('[data-action="rmCrewMember"]').forEach(btn=>{
    btn.onclick = ()=>{
      data.crews[btn.dataset.crew].splice(+btn.dataset.idx,1);
      scheduleSave(); render();
    };
  });

  document.querySelectorAll('[data-action="jobName"]').forEach(inp=>{
    inp.oninput = ()=>{ data.jobBoards[inp.dataset.board][+inp.dataset.idx].jobName = inp.value; scheduleSave(); };
  });
  document.querySelectorAll('[data-action="jobCrew"]').forEach(inp=>{
    inp.oninput = ()=>{
      data.jobBoards[inp.dataset.board][+inp.dataset.idx].crew[+inp.dataset.ci] = inp.value;
      scheduleSave();
    };
    inp.onchange = ()=>{
      const val = inp.value.trim();
      if(val && !data.masterCrew.includes(val)) { data.masterCrew.push(val); scheduleSave(); }
    };
  });

  const addForemanBtn = document.querySelector('[data-action="addForeman"]');
  if(addForemanBtn) addForemanBtn.onclick = ()=>{
    data.foremen.push({name:'New Foreman', schedule:{MON:'',TUES:'',WED:'',THUR:''}});
    scheduleSave(); render();
  };
  document.querySelectorAll('[data-action="rmForeman"]').forEach(btn=>{
    btn.onclick = ()=>{ data.foremen.splice(+btn.dataset.idx,1); scheduleSave(); render(); };
  });
  document.querySelectorAll('[data-action="foremanName"]').forEach(inp=>{
    inp.oninput = ()=>{ data.foremen[+inp.dataset.idx].name = inp.value; scheduleSave(); };
    inp.onblur = ()=>render();
  });
  document.querySelectorAll('[data-action="foremanDay"]').forEach(inp=>{
    inp.oninput = ()=>{ data.foremen[+inp.dataset.idx].schedule[inp.dataset.day] = inp.value; scheduleSave(); };
  });

  const addPtoBtn = document.querySelector('[data-action="addPto"]');
  if(addPtoBtn) addPtoBtn.onclick = ()=>{
    data.pto.push({name:'', date:new Date().toISOString().slice(0,10)});
    scheduleSave(); render();
  };
  document.querySelectorAll('[data-action="rmPto"]').forEach(btn=>{
    btn.onclick = ()=>{ data.pto.splice(+btn.dataset.idx,1); scheduleSave(); render(); };
  });
  document.querySelectorAll('[data-action="ptoName"]').forEach(inp=>{
    inp.oninput = ()=>{ data.pto[+inp.dataset.idx].name = inp.value; scheduleSave(); };
  });
  document.querySelectorAll('[data-action="ptoDate"]').forEach(inp=>{
    inp.onchange = ()=>{ data.pto[+inp.dataset.idx].date = inp.value; scheduleSave(); render(); };
  });

  const notesArea = document.querySelector('[data-action="notes"]');
  if(notesArea) notesArea.oninput = ()=>{ data.notes = notesArea.value; scheduleSave(); };

  const importBtn = document.getElementById('importJobsBtn');
  const importFile = document.getElementById('importJobsFile');
  if(importBtn && importFile){
    importBtn.onclick = ()=> importFile.click();
    importFile.onchange = ()=>{
      if(importFile.files && importFile.files[0]) handleJobsCSVFile(importFile.files[0]);
      importFile.value = '';
    };
  }
}

function cssEsc(s){ return s.replace(/(["\\])/g,'\\$1'); }

// Minimal CSV parser: handles quoted fields with commas/quotes inside.
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(field.length || row.length){ row.push(field); rows.push(row); row=[]; field=''; }
        if(c === '\r' && text[i+1] === '\n') i++;
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f && f.trim().length));
}

function extractJobsFromCSV(rows){
  if(!rows.length) return { jobs: [], addresses: {} };
  const header = rows[0].map(h => h.trim().toLowerCase());
  const nameIdx = header.indexOf('name');
  const nameConvIdx = header.findIndex(h => h.includes('name convention') || h.includes('job name-number'));
  const jobNumIdx = header.findIndex(h => h.includes('job number'));
  const addrIdx = header.findIndex(h => h === 'address' || h.includes('address'));
  const cityIdx = header.indexOf('city');
  const stateIdx = header.indexOf('state');
  const zipIdx = header.indexOf('zip');
  const hasHeader = nameIdx !== -1 || nameConvIdx !== -1 || jobNumIdx !== -1;
  const dataRows = hasHeader ? rows.slice(1) : rows;

  const jobs = [];
  const addresses = {};
  const seen = new Set();

  dataRows.forEach(r => {
    let key;
    if(nameConvIdx !== -1){
      key = (r[nameConvIdx]||'').trim();
    } else if(nameIdx !== -1 && jobNumIdx !== -1){
      const n = (r[nameIdx]||'').trim();
      const num = (r[jobNumIdx]||'').trim();
      key = num ? `${n}-${num}` : n;
    } else {
      key = (r[0]||'').trim();
    }
    if(!key || seen.has(key)) return;
    seen.add(key);
    jobs.push(key);

    if(addrIdx !== -1 || cityIdx !== -1 || stateIdx !== -1 || zipIdx !== -1){
      const parts = [];
      const street = addrIdx !== -1 ? (r[addrIdx]||'').trim() : '';
      if(street && street.toLowerCase() !== 'n/a') parts.push(street);
      const cszBits = [];
      const city = cityIdx !== -1 ? (r[cityIdx]||'').trim() : '';
      const state = stateIdx !== -1 ? (r[stateIdx]||'').trim() : '';
      const zip = zipIdx !== -1 ? (r[zipIdx]||'').trim() : '';
      if(city) cszBits.push(city);
      if(state) cszBits.push(state);
      let csz = cszBits.join(' ');
      if(zip && zip !== '0') csz = (csz + ' ' + zip).trim();
      if(csz) parts.push(csz);
      const full = parts.join(', ');
      if(full) addresses[key] = full;
    }
  });

  return { jobs, addresses };
}

function handleJobsCSVFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const rows = parseCSV(String(e.target.result));
      const { jobs, addresses } = extractJobsFromCSV(rows);
      if(!jobs.length){
        alert('No job rows found in that CSV. Expected a "Name" column (and optionally "Job Number"), or a single job-name column.');
        return;
      }
      data.masterJobs = jobs;
      data.jobAddresses = addresses;
      data.jobsUpdated = new Date().toLocaleDateString();
      scheduleSave();
      render();
    }catch(err){
      console.error(err);
      alert('Could not read that CSV file.');
    }
  };
  reader.readAsText(file);
}

function tryPin(){
  const val = document.getElementById('pinInput').value;
  if(val === MANAGER_PIN){
    isManager = true;
    showPinModal = false;
    pinError = '';
    render();
  } else {
    pinError = 'Incorrect PIN';
    render();
    setTimeout(()=>document.getElementById('pinInput')?.focus(),50);
  }
}
